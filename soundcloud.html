<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunar Archives - SoundCloud</title>
    <style>
        body {
            background-color: #0d0f12;
            color: #c5c8c6;
            font-family: monospace;
            max-width: 650px;
            margin: 0 auto;
            padding: 4rem 2rem;
            line-height: 1.6;
        }
        nav a { color: #81a2be; margin-right: 1.5rem; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        h1 { font-size: 1.4rem; color: #ffffff; letter-spacing: 0.2rem; margin-bottom: 2rem; }
        .track-item { margin-bottom: 2rem; border-bottom: 1px solid #282a2e; padding-bottom: 1.5rem; }
        .track-title { color: #f0f0f0; font-size: 1.05rem; text-decoration: none; display: block; margin-bottom: 0.5rem; }
        .track-title:hover { color: #81a2be; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">[ Home ]</a>
        <a href="youtube.html">[ YouTube ]</a>
        <a href="soundcloud.html">[ Soundcloud ]</a>
    </nav>

    <h1>SOUNDCLOUD FEED</h1>
    <div id="soundcloud-container">Loading latest tracks...</div>

    <script>
    const scRssUrl = 'https://fetchrss.com/feed/1xJhF0E6N0fK1xJhEd5ynC1q.rss';
    const scApiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(scRssUrl)}`;

    fetch(scApiUrl)
        .then(response => response.json())
        .then(data => {
            if (data.status === 'ok') {
                let output = '';
                data.items.slice(0, 5).forEach(item => {
                    output += `
                        <div class="track-item">
                            <a class="track-title" href="${item.link}" target="_blank">${item.title}</a>
                            <p><a href="${item.link}" target="_blank">[ Listen on SoundCloud ]</a></p>
                        </div>
                    `;
                });
                document.getElementById("soundcloud-container").innerHTML = output;
            } else {
                document.getElementById("soundcloud-container").innerHTML = "Unable to parse feed data.";
            }
        })
        .catch(err => {
            document.getElementById("soundcloud-container").innerHTML = "Unable to load SoundCloud feed at this time.";
        });
</script>

</body>
</html>
