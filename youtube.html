<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunar Archives - YouTube</title>
    <style>
        body {
            background-color: #0d0f12;
            color: #c5c8c6;
            font-family: monospace;
            max-width: 650px;
            margin: 0 auto;
            padding: 4rem 2rem;
            line-height: 1.6;
        }
        nav a { color: #81a2be; margin-right: 1.5rem; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        h1 { font-size: 1.4rem; color: #ffffff; letter-spacing: 0.2rem; margin-bottom: 2rem; }
        .video-item { margin-bottom: 2.5rem; border-bottom: 1px solid #282a2e; padding-bottom: 1.5rem; }
        .video-title { color: #f0f0f0; font-size: 1.05rem; text-decoration: none; display: block; margin-bottom: 0.5rem; }
        .video-title:hover { color: #81a2be; }
        iframe { width: 100%; height: 315px; border: none; margin-top: 0.5rem; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">[ Home ]</a>
        <a href="youtube.html">[ YouTube ]</a>
        <a href="soundcloud.html">[ Soundcloud ]</a>
    </nav>

    <h1>YOUTUBE FEED</h1>
    <div id="feed-container">Loading latest uploads...</div>

    <script>
        const CHANNEL_ID = 'UCk9BBi4zc0ZziMo25UEbrhQ'; // e.g., UCxxxxxx
        const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`;
        // Using a free CORS proxy to fetch the XML cleanly on static hosting
        const api = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;

        fetch(api)
            .then(response => response.json())
            .then(data => {
                const parser = new DOMParser();
                const xml = parser.parseFromString(data.contents, "text/xml");
                const entries = xml.querySelectorAll("entry");
                let output = '';

                entries.forEach((entry, index) => {
                    if(index < 5) { // Show latest 5 videos
                        const title = entry.querySelector("title").textContent;
                        const videoId = entry.querySelector("videoId") ? entry.querySelector("videoId").textContent : '';
                        const link = entry.querySelector("link").getAttribute("href");
                        
                        output += `
                            <div class="video-item">
                                <a class="video-title" href="${link}" target="_blank">${title}</a>
                                ${videoId ? `<iframe src="https://www.youtube-nocookie.com/embed/${videoId}" allowfullscreen></iframe>` : ''}
                            </div>
                        `;
                    }
                });
                document.getElementById("feed-container").innerHTML = output;
            })
            .catch(err => {
                document.getElementById("feed-container").innerHTML = "Unable to load feed at this time.";
            });
    </script>

</body>
</html>
