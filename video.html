<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <title>Lunar Archives — Video</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #1B1725;
            color: #EFD09E;
            font-family: "Space Mono", monospace;
            font-size: 0.9rem;
            max-width: 840px;
            margin: 0 auto;
            padding: 4rem 2rem;
            line-height: 1.7;
        }

        nav {
            margin-bottom: 3rem;
            font-size: 0.8rem;
            letter-spacing: 0.05rem;
        }

        nav a {
            margin-right: 1.5rem;
        }

        header {
            margin-bottom: 3rem;
        }

        header h1 {
            font-family: "Syncopate", sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.25rem;
            color: #2EC4B6;
            margin-bottom: 0.75rem;
        }

        header p {
            color: #61E294;
            font-size: 0.8rem;
            letter-spacing: 0.05rem;
            margin: 0;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2.5rem 2rem;
            margin-bottom: 4rem;
        }

        .video-card {
            background: #14111d;
            border: 1px solid #282a2e;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s ease;
        }

        .video-card:hover {
            border-color: #2EC4B6;
        }

        .video-header-bar {
            background: #1b1725;
            border-bottom: 1px solid #282a2e;
            padding: 0.5rem 0.8rem;
            display: flex;
            align-items: center;
        }

        .video-title {
            font-family: "Syncopate", sans-serif;
            font-size: 0.75rem;
            color: #2EC4B6;
            letter-spacing: 0.05rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #14111d;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        a {
            color: #EB5E28;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        a:hover {
            text-decoration: underline;
            opacity: 0.85;
        }

        footer {
            margin-top: 5rem;
            font-size: 0.75rem;
            color: #61E294;
            border-top: 1px solid #282a2e;
            padding-top: 1.5rem;
            letter-spacing: 0.05rem;
        }

        @media (max-width: 700px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">[ Home ]</a>
        <a href="video.html">[ Video ]</a>
        <a href="music.html">[ Music ]</a>
    </nav>

                    <div class="video-header-bar">

                    </div>
                <div class="video-wrapper">
                    <iframe width="560" height="315" src="https://www.youtube.com/embed/I2kndyb3kSQ?si=6-D4rlsmm9FhZDfK" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
            </div>
    
            <div class="video-card">
                <div class="video-header-bar">
                    <span class="video-title">Wending Foliose</span>
                </div>
                <div class="video-wrapper">
                    <iframe width="560" height="315" src="https://www.youtube.com/embed/QVxWgL84ouU?si=cg3Y54mt3JDXD-CO" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
            </div>
    
            <div class="video-card">
                    <div class="video-header-bar">
                        <span class="video-title">Deep Current of Being</span>
                    </div>
                <div class="video-wrapper">
                    <iframe width="560" height="315" src="https://www.youtube.com/embed/igvDIWsxQEg?si=d4qDd9AKagefB3oe" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
            </div>
    
            <div class="video-card">
                <div class="video-header-bar">
                    <span class="video-title">Deep Ambient Techno</span>
                </div>
                <div class="video-wrapper">
                    <iframe width="560" height="315" src="https://www.youtube.com/embed/J8JRJA8y17Y?si=XIudCgtM_CD2_TrX" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </main>
    
    <footer>
        <p>&copy; <script>document.write(new Date().getFullYear());</script> Lunar Archives. All rights reserved.</p>
    </footer>
    
</body>
</html>
