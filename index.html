<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunar Archives</title>
    <style>
        body {
            background-color: #0d0f12;
            color: #c5c8c6;
            font-family: monospace;
            max-width: 650px;
            margin: 0 auto;
            padding: 4rem 2rem;
            line-height: 1.6;
        }
        header h1 {
            font-size: 1.4rem;
            letter-spacing: 0.2rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }
        header p {
            color: #707880;
            font-size: 0.9rem;
            margin-bottom: 3rem;
        }
        .catalog-section h2 {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            border-bottom: 1px solid #282a2e;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            color: #81a2be;
        }
        .release {
            margin-bottom: 2rem;
        }
        .release-meta {
            font-size: 0.8rem;
            color: #707880;
        }
        .release-title {
            font-size: 1.1rem;
            color: #f0f0f0;
            margin: 0.2rem 0;
        }
        a {
            color: #81a2be;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        footer {
            margin-top: 4rem;
            font-size: 0.8rem;
            color: #525558;
            border-top: 1px solid #282a2e;
            padding-top: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>LUNAR ARCHIVES</h1>
        <p>Independent Sound Design & Audio Catalog</p>
    </header>

    <main>
        <section class="catalog-section">
            <h2>Releases</h2>
            
            <div class="release">
                <div class="release-meta">LAA0001</div>
                <div class="release-title">Sample Pack / Soundscapes</div>
                <p><a href="#" target="_blank">[ Bandcamp / Listen ]</a></p>
            </div>

            <div class="release">
                <div class="release-meta">LAA0002</div>
                <div class="release-title">Generative Ambient Works</div>
                <p><a href="#" target="_blank">[ Bandcamp / Listen ]</a></p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; <script>document.write(new Date().getFullYear());</script> Lunar Archives. All rights reserved.</p>
    </footer>

</body>
</html>
