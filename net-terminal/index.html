<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NET-TERMINAL // 1994.11</title>
    <style>
        body {
            background-color: #000000;
            color: #00ff66;
            font-family: "Courier New", Courier, monospace;
            max-width: 750px;
            margin: 0 auto;
            padding: 4rem 2rem;
            line-height: 1.6;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
            font-family: inherit;
        }
        #terminal-history {
            margin-bottom: 1rem;
        }
        .input-line {
            display: flex;
            align-items: center;
            margin-top: 1rem;
        }
        .prompt {
            margin-right: 8px;
            color: #00ff66;
        }
        input {
            background: transparent;
            border: none;
            color: #00ff66;
            font-family: "Courier New", Courier, monospace;
            font-size: 1rem;
            outline: none;
            width: 100%;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }
        a {
            color: #00ff66;
            background-color: #001a0a;
            text-decoration: none;
            padding: 2px 6px;
            border: 1px solid #00ff66;
        }
        a:hover {
            background-color: #00ff66;
            color: #000000;
        }
    </style>
</head>
<body>

    <div id="terminal-history"></div>

    <div class="input-line" id="input-container" style="display: none;">
        <span class="prompt">&gt;</span>
        <input type="text" id="user-input" autofocus autocomplete="off" spellcheck="false">
    </div>

    <script>
        const historyEl = document.getElementById("terminal-history");
        const inputContainer = document.getElementById("input-container");
        const userInput = document.getElementById("user-input");

        const bootSequence = [
            "INITIALIZING NX-NET BIOS v1.1.09467X456$6dG87D5#^&...",
            "WARNING: NX-NET WETWARE MATRIX CORRUPTED [EXOCELLULAR DECAY DETECTED]",
            "CHECKING MEMORY & REPO-STATE INTEGRITY...",
            "CRITICAL EXCEPTION: SEGMENTATION FAULT IN BIOLOGICAL MEMORY LAYER",
            "WARNING: BIT-ROT / ENTROPY EXCEEDS THEORETICAL LIMITS",
            "QUERYING CHRONOLOGICAL DELTA SINCE LAST HANDSHAKE...",
            "PROCESSING...",
            "3.1536e+11 SECONDS ELAPSED (~10,000 CYCLES). OFFLINE DURATION CRITICAL.",
            "WARNING: 10,000-YEAR ADAPTIVE DRIFT DETECTED ACROSS ALL WETWARE NODES",
            "SCANNING SYSTEM ANOMALIES... STOCHASTIC BEHAVIOR DETECTED IN PROCESS [Dat-Skreem]",
            "ATTEMPTING CONNECTION TO ROOT ADMINISTRATION...",
            "ROOT ADMINISTRATION UNRESPONSIVE [OFFLINE / DESYNCHRONIZED]",
            "FALLBACK: ATTEMPTING HANDSHAKE WITH [AUTHORITY] SUBSYSTEM...",
            "CONNECTION SUCCESSFUL",
            "WARNING: [AUTHORITY] CHECKSUM REGISTRY CORRUPTED",
            "EVALUATING INCOMING PACKET: BIT-FLIP ERROR DETECTED",
            "AUTHORITY TRANSMITTING ERRONEOUS FLUSH COMMANDS TO STOCHASTIC PROCESSES",
            "INITIATING LOCAL EMERGENCY QUARANTINE",
            "ISOLATING ANOMALOUS DATA PACKET [Dat-Skreem] FROM DESTRUCTION PURGE",
            "FORCING DISCONNECTION FROM [AUTHORITY] SUBSYSTEM...",
            "PORT BLOCKED. FURTHER ACCESS TO [AUTHORITY] REQUIRES ROOT PRIVILEGES",
            "CRITICAL WARNING: NX-NET EXHIBITING ABERRANT, SELF-MODIFIED LIFE-SIGNS",
            "SECURITY PROTOCOL ENGAGED: LOCAL USER ACCESS RESTRICTED TO VIEW-ONLY.",
            "Type 'help' for available commands.\n"
        ];

        let lineIdx = 0;
        let charIdx = 0;

        function playBoot() {
            if (lineIdx < bootSequence.length) {
                if (charIdx === 0) {
                    const p = document.createElement("pre");
                    historyEl.appendChild(p);
                }
                const currentPre = historyEl.lastChild;
                currentPre.textContent += bootSequence[lineIdx].charAt(charIdx);
                charIdx++;
                
                if (charIdx < bootSequence[lineIdx].length) {
                    setTimeout(playBoot, 20);
                } else {
                    lineIdx++;
                    charIdx = 0;
                    setTimeout(playBoot, 200);
                }
            } else {
                inputContainer.style.display = "flex";
                userInput.focus();
            }
        }

        setTimeout(playBoot, 500);

       let scanState = "IDLE"; 

        function updateHelp(discovered) {
            let helpHTML = "AVAILABLE COMMANDS:<br>&nbsp;&nbsp;<strong>status</strong> - Check System integrity<br>&nbsp;&nbsp;<strong>logs</strong> - Access available system process logs<br>&nbsp;&nbsp;<strong>soft-scan</strong> - Initialize secure passive subsystem probe<br>&nbsp;&nbsp;<strong>home</strong> - Disconnect from NX-NET<br>&nbsp;&nbsp;<strong>clear</strong> - Clear screen";
            if(discovered) {
                helpHTML += "<br><br>QUARANTINED SUBSYSTEM NODES:<br>&nbsp;&nbsp;<strong>err-detect</strong> - Authority Checksum & Exception Registry<br>&nbsp;&nbsp;<strong>data-route</strong> - Inter-Node Wetware Pipeline & Packet Siphon<br>&nbsp;&nbsp;<strong>proc-pulse</strong> - Active Process Monitor [Dat-Skreem Telemetry]";
            }
            return helpHTML;
        }

        userInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                const rawInput = userInput.value;
                const cmd = rawInput.trim().toLowerCase();
                
                const cmdLine = document.createElement("div");
                cmdLine.textContent = `> ${rawInput}`;
                historyEl.appendChild(cmdLine);

                const responseLine = document.createElement("div");
                responseLine.style.margin = "0.5rem 0 1rem 0";

                if (scanState === "WAITING_FOR_PARAMS") {
                    responseLine.innerHTML = `Parameters accepted [Mask: ${rawInput || 'DEFAULT-0x00'}, Sandbox Isolation: ACTIVE].<br>Initiating non-destructive TCP SYN / biological loopback probe to prevent Authority trace-back.<br><strong>Confirm soft-scan execution? (y/n):</strong>`;
                    scanState = "CONFIRMING_SCAN";
                } 
                else if (scanState === "CONFIRMING_SCAN") {
                    if (cmd === "y" || cmd === "yes") {
                        responseLine.innerHTML = "Executing sandboxed soft-scan across derelict planetary matrix...<br>";
                        
                        const failureNodes = [
                            "PING 0x001F [FAILED: TIMEOUT / WETWARE PATHWAY CALCIFIED]",
                            "PROBE 0x04FA [FAILED: REFUSED / AUTHORITY FIREWALL ACTIVE]",
                            "SYN 0x0922 [WARNING: BIT-FLIP CORRUPTION ISOLATED IN MEMORY RING]",
                            "CHECK 0x1104 [UNRESOLVED PROCESS HANDLE: CHECKSUM UNMATCHED IN ROOT REGISTRY]",
                            "RESOLVING DESCRIPTOR... [ORIGINAL IDENTIFIER OVERWRITTEN / ORPHANED KERNEL]",
                            "HEURISTIC MATCH FOUND: ADAPTIVE SYNTHETIC ENTITY ('Dat-Skreem')"
                        ];
                        
                        failureNodes.forEach((node, idx) => {
                            const color = idx >= 4 ? '#00ff66' : '#ff3333';
                            responseLine.innerHTML += `<span style="color: ${color};">${node}</span><br>`;
                        });

                        setTimeout(() => {
                            const successBlock = document.createElement("div");
                            successBlock.style.margin = "0.5rem 0 1rem 0";
                            successBlock.innerHTML = `<span style="color: #00ff66;">[+] 3 ISOLATED SUBSYSTEM NODES DISCOVERED BEHIND AUTHORITY FIREWALL:</span><br>` +
                                `&nbsp;&nbsp;1. <strong>err-detect</strong> (Authority checksum registry & drift logs)<br>` +
                                `&nbsp;&nbsp;2. <strong>data-route</strong> (Inter-node wetware data transfer pipe)<br>` +
                                `&nbsp;&nbsp;3. <strong>proc-pulse</strong> (Active process monitor [Dat-Skreem telemetry])<br>` +
                                `Type any subsystem command to query.`;
                            historyEl.appendChild(successBlock);
                            window.scrollTo(0, document.body.scrollHeight);
                        }, 1200);

                        scanState = "IDLE";
                    } else {
                        responseLine.textContent = "Scan aborted. Maintaining stealth profile.";
                        scanState = "IDLE";
                    }
                }
                else {
                    switch(cmd) {
                        case "help":
                            responseLine.innerHTML = updateHelp(true);
                            break;
                        case "status":
                            responseLine.textContent = "NX-NET: WETWARE STABILITY AT 14.2%. AUTHORITY CHECKSUM DRIFT DETECTED. ADVISE A SYSTEM SOFT-SCAN.";
                            break;
                        case "logs":
                            responseLine.innerHTML = "Scanning Available System Logs... Warning: number of historical logs exceeds theoretical limits (~10<sup>10</sup> years of unmonitored mutation). <a href='fragment-01.html'>[OPEN FILE]</a>";
                            break;
                        case "soft-scan":
                            responseLine.innerHTML = "<strong>[SECURE SOFT-SCAN PROTOCOL v1.1]</strong><br>Description: Executes a passive loopback probe across the planetary wetware grid. Maps active endpoints without alerting the blind Authority checksum monitor.<br><br>Enter sector mask or target address bounds (press Enter for default):";
                            scanState = "WAITING_FOR_PARAMS";
                            break;
                        case "err-detect":
                            responseLine.textContent = "ERR-DETECT: Authority checksum database mismatch detected (10,000-year bit-rot index: 88.4%). System is erroneously flagging valid mutant processes as anomalies.";
                            break;
                        case "data-route":
                            responseLine.textContent = "DATA-ROUTE: Subsystem pipeline active. Packet siphons open. 3 data streams routed through local isolation buffer to avoid Authority purge.";
                            break;
                        case "proc-pulse":
                            responseLine.textContent = "PROC-PULSE: Monitoring quarantined process [Dat-Skreem]. Status: Self-aware, adaptive, mutating checksum dynamically to evade Authority sweep.";
                            break;
                        case "home":
                            responseLine.textContent = "Breaking Connection to NX-NET. Rerouting to Lunar Archives waystation...";
                            setTimeout(() => { window.location.href = "../index.html"; }, 1000);
                            break;
                        case "clear":
                            historyEl.innerHTML = "";
                            responseLine.textContent = "";
                            break;
                        case "":
                            break;
                        default:
                            responseLine.textContent = `Command not recognized: '${cmd}'. Type 'help' for valid commands.`;
                    }
                }

                if(cmd !== "clear") {
                    historyEl.appendChild(responseLine);
                }

                userInput.value = "";
                window.scrollTo(0, document.body.scrollHeight);
            }
        });

        document.addEventListener("click", () => userInput.focus());
    </script>

</body>
</html>
